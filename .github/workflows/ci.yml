name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --extra dev

      # Catches malformed factor specs, unregistered sources, gates declared in
      # config but not implemented, and scale curves that don't ascend. Far cheaper
      # to fail here than to discover it halfway through a 2000-site sweep.
      - name: Validate registry
        run: uv run dcgeo doctor

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      # Docs are generated from the registries. If this produces a diff, someone
      # edited a factor spec without regenerating, and the docs are now lying.
      - name: Docs are in sync with the registry
        run: |
          uv run dcgeo docs
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale. Run 'uv run dcgeo docs' and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
