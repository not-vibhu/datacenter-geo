[project]
name = "dcgeo"
version = "0.1.0"
description = "Agent harness for AI data center site suitability analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "shapely>=2.0",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3", "pyproj>=3.6", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dcgeo = "dcgeo.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcgeo"]

[tool.ruff]
line-length = 100

# Pinned explicitly so CI does not start failing when ruff changes its defaults.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "RUF001",  # the factor specs legitimately contain non-ASCII (e.g. 东数西算)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
