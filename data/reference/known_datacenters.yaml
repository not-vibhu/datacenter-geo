# Validation set for /dc-validate.
#
# WHY NEGATIVE CONTROLS MATTER MORE THAN POSITIVE ONES
# Any scoring model will rate Ashburn highly — it is surrounded by data centers. The
# real question is whether the model REJECTS sites that were actually rejected. A model
# that scores everything 70-80 is useless no matter how well it ranks the winners.
#
# The strongest test in this file is the Hanover County pair: the same developer
# (Tract), in the same county, had a 1,200-acre campus APPROVED in 2024 and a 430-acre
# campus REJECTED 4-3 in May 2026. Jurisdiction, state incentives, climate, and grid
# are all held constant. If the model cannot separate these two, it is not measuring
# anything real about local approval risk.
#
# COORDINATES are approximate area centroids, not exact facility locations. That is
# appropriate — this system analyzes areas, not buildings. Anything marked
# `coord_confidence: low` should be refined before being used as evidence.
version: 1
last_reviewed: 2026-09-02

cases:

