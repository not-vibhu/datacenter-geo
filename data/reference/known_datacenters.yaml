# ─────────────────────────── HOW TO READ RESULTS ───────────────────────────
scoring_guidance: >
  Agreement rate alone is not the metric. The metric is DISCRIMINATION: the mean score
  of the `operating` and `announced` cases minus the mean score of the `rejected` cases.
  If those means are close, the model is not working, however high the agreement rate
  looks.

  Disagreements are findings, not failures. A model that scores an operating data
  center as NO-GO is telling you something: either a threshold is wrong, or the site
  really does have that problem and was built anyway for reasons outside the model —
  an incumbent's adjacent campus, a strategic customer, a subsidized deal. Investigate
  before adjusting.

  NEVER tune thresholds to fit this set. It is a dozen sites; fitting to it destroys
  generality. If a threshold is wrong, change it because the domain argument is wrong,
  and record the reasoning in the factor spec.
