# Community & social license domain — 4 factors
# Small in count, large in consequence. Community opposition is now the leading
# cause of US data center project cancellation at the local approval stage.
domain: community
domain_weight: {hyperscale_training: 6, inference_edge: 5, retrofit_colo: 5}
description: >
  Will the people who live here let this be built, and will they let it expand?
  Entirely Tier C by nature — this domain is built from local news, meeting minutes,
  petitions, and election results. It is also the domain where a good analysis most
  differentiates itself, because nobody else systematically collects it.

factors:

  - id: com.opposition_risk
    name: Organized opposition risk
    question: Is there active, organized opposition to data centers in this jurisdiction?
    unit: category
    direction: categorical
    best_tier: C
    categories:
      supportive_precedent: 100     # prior DC approved with local support
      neutral_no_precedent: 72
      mixed_contested: 45
      organized_opposition: 20
      moratorium_active: 0
      unknown: null
    sources: [local_news_search, county_meeting_minutes, change_org, dc_watch_trackers]
    adapter: dcgeo.adapters.sentiment:opposition_status
    weights: {hyperscale_training: 8, inference_edge: 6, retrofit_colo: 6}
    gate: gate.no_active_moratorium
    notes: >
      Search the county or municipality name with "data center" plus terms like
      moratorium, rezoning, opposition, hearing, and referendum, across at least the
      trailing 24 months. Read the actual meeting minutes where available — the vote
      counts on prior applications are the single best predictor of the next one.
      An active moratorium is a hard gate. Note that opposition frequently clusters:
      one contested project in a county reliably raises the temperature for the next.

  - id: com.residential_proximity
    name: Residential proximity and noise exposure
    question: How many residences fall within the noise-relevant buffer?
    unit: dwellings_within_1km
    direction: lower_is_better
    best_tier: A
    scale:
      type: piecewise
      points: [[0, 100], [10, 92], [50, 78], [200, 55], [600, 30], [1500, 10], [4000, 0]]
    sources: [ghsl_built_s, osm_buildings, worldpop, microsoft_building_footprints]
    adapter: dcgeo.adapters.population:dwellings_within
    weights: {hyperscale_training: 7, inference_edge: 4, retrofit_colo: 5}
    notes: >
      Noise from chillers, dry coolers, and generator testing is the most common
      specific complaint in US data center opposition — more common than water, and
      far more common than power. Distance is the cheapest possible mitigation, which
      makes this factor unusually actionable. Where dwelling counts are high, the
      Recommender should price acoustic barriers, low-noise fan selections, and
      setback increases explicitly.

  - id: com.economic_alignment
    name: Local economic alignment
    question: Does the local economy want this kind of investment?
    unit: index_0_100
    direction: higher_is_better
    best_tier: C
    scale:
      type: piecewise
      points: [[0, 0], [25, 25], [50, 50], [75, 75], [100, 100]]
    sources: [bls_local_unemployment, county_edc_priorities, census_acs, state_edc]
    adapter: dcgeo.adapters.econ:local_alignment
    weights: {hyperscale_training: 5, inference_edge: 4, retrofit_colo: 4}
    notes: >
      Composite of unemployment, tax base concentration, EDC stated priorities, and
      whether the county has actively recruited data centers. Counties with a narrow
      tax base and an active EDC are structurally the most welcoming. Be candid in
      the report that AI data centers create very few permanent jobs relative to their
      capital cost — typically 25-60 permanent roles for a large campus — because
      overstating jobs is the fastest way to lose community trust, and because the
      permanent-jobs number is what local opposition will fact-check first.

  - id: com.grid_cost_allocation
    name: Ratepayer cost allocation sensitivity
    question: Will this load raise local retail rates, and is that politically live?
    unit: category
    direction: categorical
    best_tier: C
    categories:
      isolated_or_self_supplied: 100
      cost_causation_rules_clear: 76
      allocation_debated: 42
      active_ratepayer_backlash: 12
      unknown: null
    sources: [puc_dockets, state_regulator_filings, local_news_search]
    adapter: dcgeo.adapters.sentiment:ratepayer_status
    weights: {hyperscale_training: 6, inference_edge: 3, retrofit_colo: 4}
    notes: >
      The fastest-growing category of data center opposition, and structurally
      different from noise or water complaints because it mobilizes ratepayers who
      live nowhere near the site. Several US states opened proceedings in 2024-2026
      on whether large loads should bear their own grid costs. A site in a
      jurisdiction with clear cost-causation rules and a signed large-load tariff is
      materially de-risked; a site in a jurisdiction actively litigating the question
      carries an open-ended liability that should be surfaced to an investment
      committee rather than buried.
